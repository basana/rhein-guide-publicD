<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5602E">
<title>Rhine Gorge Castles — Koblenz to Bingen</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-marksburg-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F6EEDD;
    --parchment-deep: #EFE0BE;
    --gold: #C9A05C;
    --terracotta: #B5602E;
    --ink: #5A4327;
    --ink-soft: #8A6A34;
    --cream-text: #FCEFDD;
    --pad: clamp(16px, 5vw, 24px);
    --sans: system-ui, -apple-system, sans-serif;
    --scale: 1;
    --done: #4A6B4E;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--parchment);
    font-family: 'EB Garamond', serif;
    color: var(--ink);
    height: 100%;
  }

  .app {
    display: flex; flex-direction: column; height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  .header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 14px var(--pad) 10px; border-bottom: 1px solid var(--gold);
  }

  .app-name { font-size: clamp(16px, 4vw, 19px); font-weight: 600; margin: 0; }
  .header-controls { display: flex; align-items: center; gap: 6px; font-family: var(--sans); }

  .pill-btn {
    background: var(--parchment-deep); border: 1px solid var(--gold);
    color: var(--ink-soft); border-radius: 8px; font-size: 12px;
    padding: 5px 9px; line-height: 1; cursor: pointer; font-weight: 600;
  }
  .pill-btn.active { background: var(--terracotta); color: var(--cream-text); border-color: var(--terracotta); }

  .tabs {
    flex: 0 0 auto; display: flex; overflow-x: auto; gap: 8px;
    padding: 10px var(--pad); font-family: var(--sans);
    border-bottom: 1px solid var(--gold); scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto; font-size: 12px; padding: 6px 14px; border-radius: 20px;
    color: var(--ink-soft); white-space: nowrap; cursor: pointer; border: 1px solid transparent;
  }
  .tab.active { background: var(--terracotta); color: var(--cream-text); font-weight: 500; border-color: var(--terracotta); }

  .content { flex: 1 1 auto; overflow-y: auto; padding: 14px var(--pad) 20px; max-width: 580px; margin: 0 auto; width: 100%; position: relative; }
  .view { display: none; }
  .view.active { display: block; }

  .photo {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    margin: 4px 0 18px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, #E8D9B5 0%, #D9C193 55%, #B98B4F 100%);
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold);
  }
  .photo svg { width: 45%; height: 45%; opacity: 0.85; }

  .badge {
    position: absolute; top: 10px; left: 10px;
    background: rgba(181, 96, 46, 0.92); color: var(--cream-text);
    font-size: 11px; padding: 4px 10px; border-radius: 20px; font-family: var(--sans);
  }

  .station-title {
    margin: 0 0 10px; text-align: center;
    font-size: calc(clamp(22px, 6vw, 28px) * var(--scale)); font-weight: 600;
  }

  .desc {
    margin: 0 auto 18px; max-width: 38ch; text-align: center;
    font-size: calc(clamp(15px, 4vw, 16.5px) * var(--scale)); line-height: 1.65;
  }

  .stats { display: flex; gap: 12px; margin-bottom: 18px; font-family: var(--sans); }
  .stat { flex: 1; background: var(--parchment-deep); border: 1px solid var(--gold); border-radius: 10px; padding: 10px; text-align: center; }
  .stat p:first-child { margin: 0 0 3px; font-size: 11px; color: var(--ink-soft); }
  .stat p:last-child { margin: 0; font-size: calc(15px * var(--scale)); font-weight: 600; color: var(--terracotta); }

  .actions { display: flex; gap: 10px; margin-bottom: 14px; font-family: var(--sans); }
  .btn-play {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--terracotta); color: var(--cream-text); border: none; border-radius: 10px;
    padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .btn-check {
    width: 48px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1.5px solid var(--gold); border-radius: 10px;
    color: var(--ink-soft); font-size: 20px; cursor: pointer;
  }
  .btn-check.done { background: var(--done); color: #fff; border-color: var(--done); }

  .story-block, .legend-block, .castle-card, .route-card, .info-card {
    background: var(--parchment-deep); border: 1px solid var(--gold); border-radius: 12px;
    padding: 14px; margin-bottom: 14px; font-size: calc(15px * var(--scale)); line-height: 1.6;
  }
  .story-block h4, .legend-block h4 { margin: 0 0 6px; color: var(--terracotta); font-size: 13px; text-transform: uppercase; font-family: var(--sans); letter-spacing: 0.05em; }

  .castle-name { font-size: 1.1rem; font-weight: 600; color: var(--terracotta); margin-bottom: 2px; }
  .castle-town { font-size: 0.85rem; color: var(--ink-soft); font-family: var(--sans); margin-bottom: 6px; }
  
  .route-kicker { font-size: 0.75rem; color: var(--terracotta); font-weight: 700; font-family: var(--sans); margin-bottom: 2px; }
  .route-place { font-size: 0.85rem; color: var(--ink-soft); font-family: var(--sans); margin-bottom: 6px; }
  .route-hook { font-style: italic; border-left: 3px solid var(--terracotta); padding-left: 10px; margin-top: 8px; color: var(--ink); }

  .stat-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-family: var(--sans); font-size: 0.85rem; }
  .stat-table th { text-align: left; color: var(--terracotta); border-bottom: 1px solid var(--gold); padding: 4px; }
  .stat-table td { padding: 4px; border-bottom: 1px solid var(--gold); }

  /* Обертка вкладки карты */
  #view-map { position: relative; height: 100%; padding: 0 !important; }
  #mapDiv { width: 100%; height: 100%; min-height: 60vh; border-radius: 12px; border: 1px solid var(--gold); }

  /* Аккуратная шторка поверх карты снизу */
  .map-panel {
    position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: 16px;
    background: var(--parchment-deep); border: 1.5px solid var(--gold); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(90, 67, 39, 0.35); padding: 14px;
    display: none; font-family: var(--sans);
  }
  .map-panel.open { display: block; }
  .map-panel-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .map-panel-title { font-size: 1.1rem; font-weight: 600; color: var(--terracotta); font-family: 'EB Garamond', serif; }
  .map-panel-meta { font-size: 0.8rem; color: var(--ink-soft); }
  .map-panel-close {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold);
    background: var(--parchment); color: var(--ink); font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: 0 0 28px;
  }
  .map-panel-desc { font-size: 0.9rem; line-height: 1.5; color: var(--ink); margin-bottom: 12px; font-family: 'EB Garamond', serif; }
  .map-panel-actions { display: flex; gap: 8px; }
  .map-panel-speak {
    flex: 1; min-height: 40px; border-radius: 9px; border: none;
    background: var(--terracotta); color: var(--cream-text); font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }
  .map-panel-open-guide {
    background: var(--parchment); border: 1px solid var(--gold); color: var(--ink);
    padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }

  .footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 12px var(--pad); border-top: 1px solid var(--gold); font-family: var(--sans);
    background: var(--parchment);
  }
  .nav-arrow {
    background: var(--parchment-deep); border: 1px solid var(--gold); color: var(--ink);
    border-radius: 10px; width: 38px; height: 38px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-arrow:disabled { opacity: 0.3; cursor: default; }
  .progress-track { flex: 1; height: 6px; background: var(--parchment-deep); border-radius: 3px; overflow: hidden; border: 1px solid var(--gold); }
  .progress-fill { height: 100%; background: var(--terracotta); width: 0%; }
  .progress-label { font-size: 11px; color: var(--ink-soft); white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <p class="app-name">Rhine Guide</p>
    <div class="header-controls">
      <span class="pill-btn active" data-lang="en">EN</span>
      <span class="pill-btn" data-lang="ru">RU</span>
      <span class="pill-btn" id="fontMinus">A-</span>
      <span class="pill-btn" id="fontPlus">A+</span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content">
    <!-- ГИД -->
    <div class="view active" id="view-guide">
      <div class="photo">
        <div id="photoIconContainer"></div>
        <div class="badge" id="badge"></div>
      </div>

      <h1 class="station-title" id="stationTitle"></h1>
      <p class="desc" id="stationDesc"></p>

      <div class="stats">
        <div class="stat"><p id="statTownLabel"></p><p id="statTown"></p></div>
        <div class="stat"><p id="statBuiltLabel"></p><p id="statBuilt"></p></div>
      </div>

      <div class="story-block">
        <h4 id="storyTitle"></h4>
        <p id="stationFacts" style="margin:0;"></p>
      </div>

      <div class="legend-block" id="legendContainer" style="display:none;">
        <h4 id="legendTitle"></h4>
        <p id="stationLegend" style="margin:0;"></p>
      </div>

      <div class="actions">
        <button class="btn-play" id="playBtn">▶ <span id="playLabel">Listen</span></button>
        <button class="btn-check" id="checkBtn" aria-label="Mark as visited">✓</button>
      </div>
    </div>

    <!-- ЗАМКИ -->
    <div class="view" id="view-castles"></div>

    <!-- КАРТА -->
    <div class="view" id="view-map">
      <div id="mapDiv"></div>
      <!-- Аккуратная шторка поверх карты снизу -->
      <div class="map-panel" id="mapPanel">
        <div class="map-panel-head">
          <div style="flex:1">
            <div class="map-panel-title" id="mapPanelTitle"></div>
            <div class="map-panel-meta" id="mapPanelMeta"></div>
          </div>
          <button class="map-panel-close" id="mapPanelClose">×</button>
        </div>
        <div class="map-panel-desc" id="mapPanelDesc"></div>
        <div class="map-panel-actions">
          <button class="map-panel-speak" id="mapPanelSpeak">🔊 Read Aloud</button>
          <button class="map-panel-open-guide" id="mapPanelOpenGuide">📖 Full info →</button>
        </div>
      </div>
    </div>

    <!-- ЛЕГЕНДЫ -->
    <div class="view" id="view-legends"></div>

    <!-- ИНФО -->
    <div class="view" id="view-info"></div>

    <!-- ПО ПУТИ -->
    <div class="view" id="view-route"></div>
  </div>

  <div class="footer">
    <button class="nav-arrow" id="prevBtn" aria-label="Previous station">←</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 0</span>
    <button class="nav-arrow" id="nextBtn" aria-label="Next station">→</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

const castles = [

function initMap() {
  if (leafletMap) {
    setTimeout(() => leafletMap.invalidateSize(), 50);
    return;
  }

  leafletMap = L.map('mapDiv', { scrollWheelZoom: true }).setView([50.08, 7.75], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(leafletMap);
  
  const points = [];
  castles.forEach((c, i) => {
    if (typeof c.lat !== 'number') return;
    points.push([c.lat, c.lng]);
    const marker = L.circleMarker([c.lat, c.lng], {
      radius: 10, color: '#fff', weight: 2, fillColor: '#B5602E', fillOpacity: 1
    }).addTo(leafletMap);
    
    marker.on('click', () => {
      selectedIndex = i;
      showMapPanel(i);
    });
    marker.bindTooltip(c.name);
  });

  if (points.length) {
    L.polyline(points, { color: '#B5602E', weight: 2, opacity: 0.6, dashArray: '4 6' }).addTo(leafletMap);
    leafletMap.fitBounds(points, { padding: [20, 20] });
  }

  document.getElementById('mapPanelClose').onclick = () => {
    document.getElementById('mapPanel').classList.remove('open');
    selectedIndex = -1;
  };

  document.getElementById('mapPanelOpenGuide').onclick = () => {
    if (selectedIndex >= 0) {
      index = selectedIndex;
      switchView('guide');
      renderGuide();
    }
  };

  document.getElementById('mapPanelSpeak').onclick = () => {
    if (!('speechSynthesis' in window) || selectedIndex < 0) return;
    window.speechSynthesis.cancel();
    const c = castles[selectedIndex];
    const text = lang === 'ru' ? (c.sayRu || c.factsRu) : (c.say || c.facts);
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === 'ru' ? 'ru-RU' : 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  };
}

function showMapPanel(i) {
  const c = castles[i];
  const panel = document.getElementById('mapPanel');
  if (!panel) return;

  document.getElementById('mapPanelTitle').textContent = c.name;
  document.getElementById('mapPanelMeta').textContent = `${c.town}${c.pop && c.pop !== '—' ? ' · ' + c.pop : ''} • ${lang === 'ru' ? c.builtRu : c.built}`;
  
  const shortText = lang === 'ru' ? (c.sayRu || c.factsRu) : (c.say || c.facts);
  document.getElementById('mapPanelDesc').textContent = shortText;
  
  panel.classList.add('open');
  if (leafletMap) leafletMap.panTo([c.lat, c.lng], { animate: true, duration: 0.3 });
}
