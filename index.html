<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5602E">
<title>Rhine Gorge Castles — Koblenz to Bingen</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-marksburg-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F6EEDD;
    --parchment-deep: #EFE0BE;
    --gold: #C9A05C;
    --terracotta: #B5602E;
    --ink: #5A4327;
    --ink-soft: #8A6A34;
    --cream-text: #FCEFDD;
    --pad: clamp(16px, 5vw, 24px);
    --sans: system-ui, -apple-system, sans-serif;
    --scale: 1;
    --done: #4A6B4E;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--parchment);
    font-family: 'EB Garamond', serif;
    color: var(--ink);
    height: 100%;
  }

  .app {
    display: flex; flex-direction: column; height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  .header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 14px var(--pad) 10px; border-bottom: 1px solid var(--gold);
  }

  .app-name { font-size: clamp(16px, 4vw, 19px); font-weight: 600; margin: 0; }
  .header-controls { display: flex; align-items: center; gap: 6px; font-family: var(--sans); }

  .pill-btn {
    background: var(--parchment-deep); border: 1px solid var(--gold);
    color: var(--ink-soft); border-radius: 8px; font-size: 12px;
    padding: 5px 9px; line-height: 1; cursor: pointer; font-weight: 600;
  }
  .pill-btn.active { background: var(--terracotta); color: var(--cream-text); border-color: var(--terracotta); }

  .tabs {
    flex: 0 0 auto; display: flex; overflow-x: auto; gap: 8px;
    padding: 10px var(--pad); font-family: var(--sans);
    border-bottom: 1px solid var(--gold); scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto; font-size: 12px; padding: 6px 14px; border-radius: 20px;
    color: var(--ink-soft); white-space: nowrap; cursor: pointer; border: 1px solid transparent;
  }
  .tab.active { background: var(--terracotta); color: var(--cream-text); font-weight: 500; border-color: var(--terracotta); }

  .content { flex: 1 1 auto; overflow-y: auto; padding: 14px var(--pad) 20px; max-width: 540px; margin: 0 auto; width: 100%; }
  .view { display: none; }
  .view.active { display: block; }

  .photo {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    margin: 4px 0 18px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, #E8D9B5 0%, #D9C193 55%, #B98B4F 100%);
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold);
  }
  .photo svg { width: 45%; height: 45%; opacity: 0.85; }

  .badge {
    position: absolute; top: 10px; left: 10px;
    background: rgba(181, 96, 46, 0.92); color: var(--cream-text);
    font-size: 11px; padding: 4px 10px; border-radius: 20px; font-family: var(--sans);
  }

  .station-title {
    margin: 0 0 10px; text-align: center;
    font-size: calc(clamp(22px, 6vw, 28px) * var(--scale)); font-weight: 600;
  }

  .desc {
    margin: 0 auto 18px; max-width: 38ch; text-align: center;
    font-size: calc(clamp(15px, 4vw, 16.5px) * var(--scale)); line-height: 1.65;
  }

  .stats { display: flex; gap: 12px; margin-bottom: 18px; font-family: var(--sans); }
  .stat { flex: 1; background: var(--parchment-deep); border: 1px solid var(--gold); border-radius: 10px; padding: 10px; text-align: center; }
  .stat p:first-child { margin: 0 0 3px; font-size: 11px; color: var(--ink-soft); }
  .stat p:last-child { margin: 0; font-size: calc(15px * var(--scale)); font-weight: 600; color: var(--terracotta); }

  .actions { display: flex; gap: 10px; margin-bottom: 14px; font-family: var(--sans); }
  .btn-play {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--terracotta); color: var(--cream-text); border: none; border-radius: 10px;
    padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .btn-check {
    width: 48px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1.5px solid var(--gold); border-radius: 10px;
    color: var(--ink-soft); font-size: 20px; cursor: pointer;
  }
  .btn-check.done { background: var(--done); color: #fff; border-color: var(--done); }

  .story-block, .legend-block {
    background: var(--parchment-deep); border: 1px solid var(--gold); border-radius: 12px;
    padding: 14px; margin-bottom: 14px; font-size: calc(15px * var(--scale)); line-height: 1.6;
  }
  .story-block h4, .legend-block h4 { margin: 0 0 6px; color: var(--terracotta); font-size: 13px; text-transform: uppercase; font-family: var(--sans); letter-spacing: 0.05em; }

  #mapDiv { width: 100%; height: 56vh; min-height: 340px; border-radius: 12px; border: 1px solid var(--gold); margin-bottom: 10px; }
  .castle-card, .route-card, .info-card {
    background: var(--parchment-deep); border: 1px solid var(--gold); border-radius: 12px;
    padding: 14px; margin-bottom: 12px; cursor: pointer;
  }
  .castle-name { font-size: 1.1rem; font-weight: 600; color: var(--terracotta); margin-bottom: 2px; }
  .castle-town { font-size: 0.85rem; color: var(--ink-soft); font-family: var(--sans); margin-bottom: 6px; }

  .footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 12px var(--pad); border-top: 1px solid var(--gold); font-family: var(--sans);
    background: var(--parchment);
  }
  .nav-arrow {
    background: var(--parchment-deep); border: 1px solid var(--gold); color: var(--ink);
    border-radius: 10px; width: 38px; height: 38px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-arrow:disabled { opacity: 0.3; cursor: default; }
  .progress-track { flex: 1; height: 6px; background: var(--parchment-deep); border-radius: 3px; overflow: hidden; border: 1px solid var(--gold); }
  .progress-fill { height: 100%; background: var(--terracotta); width: 0%; }
  .progress-label { font-size: 11px; color: var(--ink-soft); white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <p class="app-name">Rhine Guide</p>
    <div class="header-controls">
      <span class="pill-btn active" data-lang="en">EN</span>
      <span class="pill-btn" data-lang="ru">RU</span>
      <span class="pill-btn" id="fontMinus">A-</span>
      <span class="pill-btn" id="fontPlus">A+</span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content">
    <!-- ГИД -->
    <div class="view active" id="view-guide">
      <div class="photo">
        <div id="photoIconContainer"></div>
        <div class="badge" id="badge"></div>
      </div>

      <h1 class="station-title" id="stationTitle"></h1>
      <p class="desc" id="stationDesc"></p>

      <div class="stats">
        <div class="stat"><p id="statTownLabel"></p><p id="statTown"></p></div>
        <div class="stat"><p id="statBuiltLabel"></p><p id="statBuilt"></p></div>
      </div>

      <div class="story-block">
        <h4 id="storyTitle"></h4>
        <p id="stationFacts" style="margin:0;"></p>
      </div>

      <div class="legend-block" id="legendContainer" style="display:none;">
        <h4 id="legendTitle"></h4>
        <p id="stationLegend" style="margin:0;"></p>
      </div>

      <div class="actions">
        <button class="btn-play" id="playBtn">▶ <span id="playLabel">Listen</span></button>
        <button class="btn-check" id="checkBtn" aria-label="Mark as visited">✓</button>
      </div>
    </div>

    <!-- ЗАМКИ -->
    <div class="view" id="view-castles"></div>

    <!-- КАРТА -->
    <div class="view" id="view-map">
      <div id="mapDiv"></div>
      <p style="font-size:0.85rem; color:var(--ink-soft); text-align:center; font-family:var(--sans); margin:8px 0 0;" id="mapHint"></p>
    </div>

    <!-- ЛЕГЕНДЫ -->
    <div class="view" id="view-legends"></div>

    <!-- ИНФО -->
    <div class="view" id="view-info"></div>
  </div>

  <div class="footer">
    <button class="nav-arrow" id="prevBtn" aria-label="Previous station">←</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 0</span>
    <button class="nav-arrow" id="nextBtn" aria-label="Next station">→</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    factsRu: "Маленькая таможенная башня на островке, восстановлена в 1855 году.",
    legend: "Cruel Bishop Hatto was hunted down and eaten alive by an army of mice right here. Historians say it's a pure legend; the name likely comes from 'Mautturm' (toll tower).",
    legendRu: "Жестокого епископа Хатто здесь заживо съели мыши. Историки говорят, что это легенда, а название происходит от «Mautturm» (таможня)."
  },
  {
    id: "hildegard", icon: "abbey", lat: 49.9924372, lng: 7.9283458,
    name: "Abtei St. Hildegard", town: "Eibingen / Rüdesheim", pop: "—",
    built: "Founded 1165", builtRu: "Основан в 1165",
    destroyed: "—", destroyedRu: "—",
    facts: "Benedictine convent. Hildegard von Bingen lived in the 1100s as a nun, writer, doctor, and composer.",
    factsRu: "Бенедиктинский монастырь. Хильдегарда Бингенская жила здесь в XII веке как монахиня, писательница, врач и композитор.",
    legend: "She reported divine visions since childhood and was named a Doctor of the Church in 2012.",
    legendRu: "Она рассказывала о видениях с детства, а в 2012 году была объявлена Учителем Церкви."
  },
  {
    id: "bromserburg", lat: 49.9776596, lng: 7.9177834,
    name: "Bromserburg", town: "Rüdesheim am Rhein", pop: "~10,000",
    built: "1210", builtRu: "1210 год",
    destroyed: "—", destroyedRu: "—",
    facts: "Oldest building in Rüdesheim, now a wine museum at the end of our castle route.",
    factsRu: "Старейшее здание Рюдесхайма, ныне музей вина в конце нашего замкового маршрута."
  }
];

const ICONS = {
  castle: '<svg viewBox="0 0 24 24" fill="none" stroke="#B5602E" stroke-width="1.8"><path d="M3 21h18M4 21V10h3V7h2v3h2V5h2v5h2V7h2v3h3v11" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="14" width="4" height="7" fill="#B5602E" stroke="none"/></svg>',
  tower: '<svg viewBox="0 0 24 24" fill="none" stroke="#B5602E" stroke-width="1.8"><path d="M9 21V9h6v12M8 9l1-4h6l1 4M7 21h10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  rock: '<svg viewBox="0 0 24 24" fill="none" stroke="#B5602E" stroke-width="1.8"><path d="M3 21l3-9 3 4 2-6 3 5 2-3 5 9H3z" stroke-linejoin="round"/></svg>',
  abbey: '<svg viewBox="0 0 24 24" fill="none" stroke="#B5602E" stroke-width="1.8"><path d="M4 21V11l8-6 8 6v10M4 21h16M9 21v-6h6v6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 5V2M10.5 3.5h3" stroke-linecap="round"/></svg>'
};

const UI = {
  en: {
    tabs: ['Guide', 'Castles', 'Map', 'Legends', 'Info'],
    stationLabel: (n, t) => `Station ${n} of ${t}`,
    built: 'Built', town: 'Town', play: 'Listen', check: 'Visited',
    story: 'Historical Facts', legend: 'Legend & Lore',
    mapHint: 'Tap a red marker on the map to open the station.'
  },
  ru: {
    tabs: ['Гид', 'Замки', 'Карта', 'Легенды', 'Инфо'],
    stationLabel: (n, t) => `Остановка ${n} из ${t}`,
    built: 'Построен', town: 'Город', play: 'Слушать', check: 'Посещено',
    story: 'Исторические факты', legend: 'Легенды и предания',
    mapHint: 'Нажмите на красную точку на карте, чтобы открыть станцию.'
  }
};

let lang = 'en';
let index = 2; // Marksburg по умолчанию
let scale = 1.0;
const visited = new Set();
let leafletMap = null;

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  UI[lang].tabs.forEach((label, i) => {
    const s = document.createElement('span');
    const tabKeys = ['guide', 'castles', 'map', 'legends', 'info'];
    s.className = 'tab' + (tabKeys[i] === currentView ? ' active' : '');
    s.textContent = label;
    s.onclick = () => switchView(tabKeys[i]);
    tabsEl.appendChild(s);
  });
}

let currentView = 'guide';
function switchView(viewName) {
  currentView = viewName;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewName).classList.add('active');
  renderTabs();
  if (viewName === 'map') {
    setTimeout(() => {
      if (!leafletMap) initMap();
      else leafletMap.invalidateSize();
    }, 50);
  }
}

function renderGuide() {
  const s = castles[index];
  const t = UI[lang];
  
  document.getElementById('photoIconContainer').innerHTML = ICONS[s.icon || 'castle'];
  document.getElementById('badge').textContent = t.stationLabel(index + 1, castles.length);
  document.getElementById('stationTitle').textContent = s.name;
  document.getElementById('stationDesc').textContent = lang === 'ru' ? (s.sayRu || s.factsRu) : (s.say || s.facts);
  
  document.getElementById('statTownLabel').textContent = t.town;
  document.getElementById('statTown').textContent = s.town;
  document.getElementById('statBuiltLabel').textContent = t.built;
  document.getElementById('statBuilt').textContent = lang === 'ru' ? s.builtRu : s.built;

  document.getElementById('storyTitle').textContent = t.story;
  document.getElementById('stationFacts').textContent = lang === 'ru' ? s.factsRu : s.facts;

  const legendBox = document.getElementById('legendContainer');
  const legendTxt = lang === 'ru' ? s.legendRu : s.legend;
  if (legendTxt) {
    legendBox.style.display = 'block';
    document.getElementById('legendTitle').textContent = t.legend;
    document.getElementById('stationLegend').textContent = legendTxt;
  } else {
    legendBox.style.display = 'none';
  }

  document.getElementById('playLabel').textContent = t.play;
  document.getElementById('checkBtn').classList.toggle('done', visited.has(s.id));
  document.getElementById('progressFill').style.width = ((index + 1) / castles.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `${index + 1} / ${castles.length}`;
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === castles.length - 1;
  document.getElementById('mapHint').textContent = t.mapHint;
  renderTabs();
  document.documentElement.style.setProperty('--scale', scale);
}

function renderCastlesList() {
  const el = document.getElementById('view-castles');
  el.innerHTML = castles.map((c, i) => `
    <div class="castle-card" onclick="index=${i}; switchView('guide'); renderGuide();">
      <div class="castle-name">${c.name}</div>
      <div class="castle-town">${c.town} • ${lang === 'ru' ? c.builtRu : c.built}</div>
    </div>
  `).join('');
}

function renderLegendsList() {
  const el = document.getElementById('view-legends');
  const withLegends = castles.filter(c => c.legend);
  el.innerHTML = withLegends.map(c => `
    <div class="castle-card">
      <div class="castle-name">${c.name}</div>
      <p style="margin:6px 0 0; line-height:1.5;">${lang === 'ru' ? c.legendRu : c.legend}</p>
    </div>
  `).join('');
}

function renderInfo() {
  const el = document.getElementById('view-info');
  el.innerHTML = `
    <div class="castle-card">
      <div class="castle-name">UNESCO World Heritage</div>
      <p style="margin:6px 0 0; line-height:1.5;">Since 2002, the Upper Middle Rhine Valley (~65 km) is a UNESCO World Heritage Site for its unique cultural landscape of castles, vineyards and small towns.</p>
    </div>
  `;
}

function initMap() {
  leafletMap = L.map('mapDiv', { scrollWheelZoom: true }).setView([50.08, 7.75], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(leafletMap);
  
  const points = [];
  castles.forEach((c, i) => {
    if (typeof c.lat !== 'number') return;
    points.push([c.lat, c.lng]);
    const marker = L.circleMarker([c.lat, c.lng], {
      radius: 10, color: '#fff', weight: 2, fillColor: '#B5602E', fillOpacity: 1
    }).addTo(leafletMap);
    marker.on('click', () => {
      index = i;
      switchView('guide');
      renderGuide();
    });
    marker.bindTooltip(c.name);
  });
  if (points.length) leafletMap.fitBounds(points, { padding: [20, 20] });
}

document.getElementById('prevBtn').addEventListener('click', () => { if (index > 0) { index--; renderGuide(); } });
document.getElementById('nextBtn').addEventListener('click', () => { if (index < castles.length - 1) { index++; renderGuide(); } });
document.getElementById('checkBtn').addEventListener('click', () => {
  const id = castles[index].id;
  if (visited.has(id)) visited.delete(id); else visited.add(id);
  renderGuide();
});

document.querySelectorAll('.pill-btn[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.getAttribute('data-lang');
    document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b === btn));
    renderGuide();
    renderCastlesList();
    renderLegendsList();
    renderInfo();
  });
});

document.getElementById('fontMinus').addEventListener('click', () => { scale = Math.max(0.85, scale - 0.1); renderGuide(); });
document.getElementById('fontPlus').addEventListener('click', () => { scale = Math.min(1.3, scale + 0.1); renderGuide(); });

// Синтез речи (Озвучка)
document.getElementById('playBtn').addEventListener('click', () => {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const c = castles[index];
  const text = (lang === 'ru' ? (c.factsRu + '. ' + (c.legendRu || '')) : (c.facts + '. ' + (c.legend || '')));
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang === 'ru' ? 'ru-RU' : 'en-US';
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
});

// Инициализация
renderGuide();
renderCastlesList();
renderLegendsList();
renderInfo();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
